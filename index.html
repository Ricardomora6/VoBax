<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>VoBax · Vorax Bank</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A3D91">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F2F5F9;--card:#fff;--ink:#0E2238;--mut:#62758A;--line:#E1E7EF;--hero:#0A3D91;--in:#0F9F73;--out:#D9434B;--warn:#E8A030;--btn:#0A3D91;--btnt:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1522;--card:#13233A;--ink:#EAF0F8;--mut:#93A5BA;--line:#223650;--hero:#123F8F;--btn:#4B8BFF;--btnt:#08111D}}
:root[data-theme="dark"]{--bg:#0B1522;--card:#13233A;--ink:#EAF0F8;--mut:#93A5BA;--line:#223650;--hero:#123F8F;--btn:#4B8BFF;--btnt:#08111D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.4}
#root{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 120px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-top:6px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
label{display:block;margin:12px 0;font-weight:700;font-size:13px}
h1{font-size:30px;margin:8px 0 4px;font-weight:800}h2{margin:0 0 8px;font-size:20px}
.mut{color:var(--mut)}.sm{font-size:13px}.err{color:var(--out);font-size:13px;min-height:18px}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--btn);color:var(--btnt);font-weight:800;margin-top:8px}
.btn.ghost{background:transparent;color:var(--btn);border:1.5px solid var(--btn)}
.lnk{color:var(--btn);font-weight:700;font-size:13px}
.auth{padding-top:48px}.logo{width:60px;height:60px;border-radius:18px;background:var(--hero);display:grid;place-items:center;font-size:30px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:16px 0 4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 12px}
.nm{font-size:20px}.av{width:42px;height:42px;border-radius:50%;background:var(--hero);color:#fff;display:grid;place-items:center;font-weight:800}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:20px;margin-bottom:12px}
.hero .big{font-size:36px;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
.hero .eye{font-size:18px;opacity:.85}
.stats{display:flex;gap:10px;margin-top:16px}.stats div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:10px;background:var(--line);border-radius:6px;margin:12px 0 8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.mv{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mv:first-of-type{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
.grow{flex:1;min-width:0}.grow b,.grow span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;margin:4px 0 12px}.chips button{padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13px}
.chips button.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--btn);color:var(--btnt);font-size:30px;font-weight:700;box-shadow:0 6px 18px rgba(10,61,145,.35)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut)}
nav button.on{color:var(--btn)}nav span{font-size:20px}
#sheet{display:none}#sheet.open{display:block}
.ov{position:fixed;inset:0;background:rgba(5,12,22,.55)}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));max-width:448px;margin:0 auto;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
#toast.show{opacity:1}
.in{color:var(--in)}.out{color:var(--out)}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0}.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--btn)}.dots span.on{background:var(--btn)}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto 16px}.pad button{height:64px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:700}.catrow{margin:10px 0}.catrow .bar{margin:6px 0 0;height:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div><div id="sheet"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s),mem={};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n.toLocaleString('es-MX',{style:'currency',currency:'MXN'});
const store={get(k,d){try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return k in mem?mem[k]:d},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const CATS=[{n:'Comida',i:'🍜',c:'#E8A030'},{n:'Transporte',i:'🚌',c:'#4B8BFF'},{n:'Escuela',i:'📚',c:'#7B61FF'},{n:'Antojos',i:'🧋',c:'#E5559A'},{n:'Salud',i:'💊',c:'#0F9F73'},{n:'Otros',i:'🧾',c:'#8A9BB0'}];
const TIPOS={'Trabajo':'💼','Negocio propio':'🏪','Beca':'🎓','Otro':'💰'};
let users=store.get('b_users',{}),U=null,D=null,tab='inicio',hide=false,filt='todos',tipo='gasto',q='',editId=null;
const save=()=>store.set('b_data_'+U.u,D);
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtF=f=>new Date(f+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'});
const logo=s=>`<svg width="${s}" height="${s}" viewBox="0 0 64 64" role="img" aria-label="Logotipo de VoBax"><rect width="64" height="64" rx="18" style="fill:var(--hero)"/><path d="M17 19 L30 46 L43 22" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="47" cy="16" r="7" fill="#19C79A"/></svg>`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return p}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),3200)}
function sheet(h){$('#sheet').innerHTML='<div class="ov" onclick="closeS()"></div><div class="sh">'+h+'</div>';$('#sheet').classList.add('open')}
function closeS(){editId=null;$('#sheet').classList.remove('open');$('#sheet').innerHTML=''}

/* ---------- Acceso ---------- */
function authView(mode){mode=mode||'login';const reg=mode=='reg';
$('#root').innerHTML=`<div class="auth">${logo(64)}<h1>VoBax</h1><p class="mut" style="margin:0 0 2px;font-weight:700">Vorax Bank</p><p class="mut">Controla tu efectivo, quincena por quincena.</p>
<div class="seg"><button class="${reg?'':'on'}" onclick="authView('login')">Iniciar sesión</button><button class="${reg?'on':''}" onclick="authView('reg')">Crear cuenta</button></div>
${reg?'<label>Tu nombre<input id="a_n" autocomplete="name"></label>':''}
<label>Usuario<input id="a_u" autocomplete="username" autocapitalize="none"></label>
<label>Contraseña<input id="a_p" type="password" autocomplete="${reg?'new-password':'current-password'}"></label>
<div class="err" id="a_e"></div><button class="btn" onclick="doAuth('${mode}')">${reg?'Crear cuenta':'Entrar'}</button></div>`;
$('#a_p').addEventListener('keydown',e=>{if(e.key=='Enter')doAuth(mode)})}
async function doAuth(mode){const u=$('#a_u').value.trim().toLowerCase(),p=$('#a_p').value,e=$('#a_e');
if(!u||p.length<4){e.textContent='Escribe tu usuario y una contraseña de al menos 4 caracteres.';return}
const h=await hash(p);
if(mode=='reg'){const n=$('#a_n').value.trim();if(!n){e.textContent='Escribe tu nombre.';return}
if(users[u]){e.textContent='Ese usuario ya existe. Elige otro o inicia sesión.';return}
users[u]={u,nombre:n,h};store.set('b_users',users)}
else if(!users[u]||users[u].h!==h){e.textContent='Usuario o contraseña incorrectos.';return}
store.set('b_sess',u);entrar(u)}
function entrar(u,lock){U=users[u];D=Object.assign({fuentes:[],movs:[],limite:0,metas:[],limCat:{},deudas:[]},store.get('b_data_'+u,{}));tab='inicio';if(!U.pin)pinView('new','Lo usarás cada vez que abras la app.');else if(lock)pinView('lock');else{pinMode=null;app()}}
function salir(){pinMode=null;store.set('b_sess',null);U=D=null;closeS();authView('login')}

/* ---------- Cálculos ---------- */
function periodo(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),a=d.getDate()<=15,last=new Date(y,m+1,0).getDate();
const mes=d.toLocaleDateString('es-MX',{month:'long'});
return{ini:new Date(y,m,a?1:16),fin:new Date(y,m,a?15:last,23,59,59),label:(a?'1–15':'16–'+last)+' de '+mes}}
function calc(){const p=periodo();let tot=0,qi=0,qg=0;const cat={};
D.movs.forEach(m=>{const f=new Date(m.fecha+'T12:00:00'),ip=f>=p.ini&&f<=p.fin;
if(m.tipo=='entrada'){tot+=m.monto;if(ip)qi+=m.monto}else{tot-=m.monto;if(ip){qg+=m.monto;cat[m.cat]=(cat[m.cat]||0)+m.monto}}});
return{tot,qi,qg,cat,p}}
const sorted=()=>[...D.movs].sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.id.localeCompare(a.id));
const fuente=id=>D.fuentes.find(f=>f.id==id);
function movRow(m){const ent=m.tipo=='entrada',f=ent?fuente(m.cat):null,c=ent?null:CATS.find(x=>x.n==m.cat);
const ico=ent?(f?TIPOS[f.tipo]:'💰'):(c?c.i:'🧾'),tit=ent?(f?f.nombre:'Entrada'):(m.nota||m.cat),sub=(ent?(m.nota||'Entrada'):m.cat)+' · '+fmtF(m.fecha);
return`<div class="mv"><div class="ic">${ico}</div><div class="grow"><b>${esc(tit)}</b><span class="mut sm">${esc(sub)}</span></div><b class="${ent?'in':'out'}">${ent?'+':'−'}${money(m.monto)}</b>${tab=='movs'?`<button class="lnk" aria-label="Editar" onclick="editMov('${m.id}')">✏️</button><button class="lnk" aria-label="Borrar" onclick="askDel('${m.id}')">🗑</button>`:''}</div>`}

/* ---------- Vistas ---------- */
const views={
inicio(){const c=calc(),L=D.limite;let lim;
if(L){const p=c.qg/L,col=p<.8?'var(--in)':p<1?'var(--warn)':'var(--out)',msg=p<.8?'Te quedan '+money(L-c.qg):p<1?'Cuidado: solo te quedan '+money(L-c.qg):'Superaste tu límite por '+money(c.qg-L);
lim=`<section class="card"><div class="row"><b>Límite de la quincena</b><button class="lnk" onclick="setLimite()">Cambiar</button></div><div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${col}"></i></div><div class="row sm"><span>${money(c.qg)} de ${money(L)}</span><b style="color:${col}">${msg}</b></div></section>`}
else lim=`<section class="card"><b>Límite de la quincena</b><p class="mut sm">Define cuánto quieres gastar y te avisamos cuando te acerques.</p><button class="btn ghost" onclick="setLimite()">Poner límite</button></section>`;
const cats=Object.entries(c.cat).sort((a,b)=>b[1]-a[1]);
const cs=cats.length?cats.map(([n,v])=>{const k=CATS.find(x=>x.n==n)||CATS[5];return`<div class="catrow"><div class="row sm"><span>${k.i} ${esc(n)}</span><b style="color:${D.limCat[n]&&v>D.limCat[n]?'var(--out)':'inherit'}">${money(v)}${D.limCat[n]?' / '+money(D.limCat[n]):''}</b></div><div class="bar"><i style="width:${v/c.qg*100}%;background:${k.c}"></i></div></div>`}).join(''):'<p class="mut sm">Aún no registras gastos en esta quincena.</p>';
const ult=sorted().slice(0,5).map(movRow).join('')||'<p class="mut sm">Toca el botón + para registrar tu primera entrada o gasto.</p>';
return`<section class="hero"><div class="sm" style="opacity:.8">Efectivo disponible</div><div class="big"><span>${hide?'$ ••••••':money(c.tot)}</span><button class="eye" aria-label="Mostrar u ocultar saldo" onclick="hide=!hide;app()">${hide?'🙈':'👁'}</button></div>
<div class="stats"><div><span class="sm" style="opacity:.8">Entradas</span><b>${hide?'••••':money(c.qi)}</b></div><div><span class="sm" style="opacity:.8">Gastos</span><b>${hide?'••••':money(c.qg)}</b></div></div><div class="sm" style="opacity:.75;margin-top:10px">Quincena del ${c.p.label}</div></section>${lim}
${resumen(c)}<section class="card"><b>Gastos por categoría</b>${cs}</section>${meses()}
${metasCard()}<section class="card"><div class="row"><b>Últimos movimientos</b><button class="lnk" onclick="go('movs')">Ver todos</button></div>${ult}</section>`},
movs(){
return`<h2>Movimientos</h2><button class="btn ghost" style="margin:0 0 12px" onclick="pdfMes()">Descargar PDF del último mes</button><input placeholder="Buscar movimiento" value="${esc(q)}" oninput="q=this.value.toLowerCase();$('#lst').innerHTML=lista()"><div class="chips" style="margin-top:12px">${[['todos','Todos'],['entrada','Entradas'],['gasto','Gastos']].map(([k,t])=>`<button class="${filt==k?'on':''}" onclick="filt='${k}';app()">${t}</button>`).join('')}</div><section class="card" id="lst">${lista()}</section>`},
fuentes(){const tot={};D.movs.forEach(m=>{if(m.tipo=='entrada')tot[m.cat]=(tot[m.cat]||0)+m.monto});
const l=D.fuentes.map(f=>`<div class="mv"><div class="ic">${TIPOS[f.tipo]}</div><div class="grow"><b>${esc(f.nombre)}</b><span class="mut sm">${esc(f.tipo)}${f.desc?' · '+esc(f.desc):''}</span></div><b class="in">${money(tot[f.id]||0)}</b></div>`).join('');
return`<h2>Fuentes de ingreso</h2><p class="mut sm">Aquí dices de dónde entra tu dinero: tu trabajo, tu negocio, tu beca.</p><section class="card">${l||'<p class="mut sm">Todavía no tienes fuentes. Crea la primera, por ejemplo tu trabajo.</p>'}</section><button class="btn" onclick="addFuente()">Agregar fuente</button>${deudasCard()}`},
ajustes(){return`<h2>Ajustes</h2><section class="card"><div class="row"><span>Nombre</span><b>${esc(U.nombre)}</b></div><div class="row" style="margin-top:10px"><span>Usuario</span><b>${esc(U.u)}</b></div></section>
<section class="card"><div class="row"><span>Límite quincenal</span><b>${D.limite?money(D.limite):'Sin límite'}</b></div><button class="btn ghost" onclick="setLimite()">Cambiar límite</button></section>
<button class="btn ghost" onclick="pinView('new')">Cambiar NIP</button><button class="btn ghost" onclick="corte()">Corte de caja</button><button class="btn ghost" onclick="limCats()">Límites por categoría</button><button class="btn ghost" onclick="tema()">Cambiar entre modo claro y oscuro</button><button class="btn ghost" onclick="salir()">Cerrar sesión</button>`}};
function go(t){tab=t;app();window.scrollTo(0,0)}
let pinBuf='',pinMode=null,pinTmp='';
function pinView(mode,msg){closeS();pinMode=mode;pinBuf='';const t={lock:'Escribe tu NIP',new:'Crea tu NIP de 4 dígitos',confirm:'Confirma tu NIP'}[mode];
$('#root').innerHTML=`<div class="auth" style="text-align:center"><div style="display:inline-block">${logo(56)}</div><h1>${t}</h1><p class="mut sm" style="min-height:20px">${msg||''}</p><div id="dots" class="dots"></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<i></i>':`<button aria-label="${k}" onclick="pinKey('${k}')">${k}</button>`).join('')}</div>${mode=='lock'?'<button class="lnk" onclick="salir()">Olvidé mi NIP, cerrar sesión</button>':''}</div>`;dots()}
function dots(){$('#dots').innerHTML=[0,1,2,3].map(i=>`<span class="${i<pinBuf.length?'on':''}"></span>`).join('')}
async function pinKey(k){if(k=='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;dots();if(pinBuf.length<4)return;const h=await hash('pin:'+U.u+pinBuf);
if(pinMode=='lock'){if(h==U.pin){pinMode=null;tab='inicio';app()}else pinView('lock','NIP incorrecto. Intenta de nuevo.')}
else if(pinMode=='new'){pinTmp=h;pinView('confirm')}
else if(h==pinTmp){U.pin=h;users[U.u]=U;store.set('b_users',users);pinMode=null;tab='inicio';app();toast('NIP guardado.')}
else pinView('new','Los NIP no coinciden. Crea uno de nuevo.')}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&U&&U.pin&&!pinMode)pinView('lock')});
async function pdfMes(){const J=window.jspdf;if(!J){toast('No se pudo cargar el generador de PDF.');return}

const p=periodo(),y=p.ini.getFullYear(),m=p.ini.getMonth(),ini=p.ini.getDate()==1?new Date(y,m-1,16):new Date(y,m,1),cl=s=>String(s).replace(/[^\x20-\xFF]/g,''),fd=d=>d.toLocaleDateString('es-MX');
const l=sorted().reverse().filter(x=>{const f=new Date(x.fecha+'T12:00:00');return f>=ini&&f<=p.fin});
let ei=0,eg=0;l.forEach(x=>{if(x.tipo=='entrada')ei+=x.monto;else eg+=x.monto});
const doc=new J.jsPDF();let r=20;
doc.setFontSize(18);doc.text('VoBax (Vorax Bank) - Movimientos de efectivo',14,r);
doc.setFontSize(10);r+=8;doc.text(cl(U.nombre)+'  |  Del '+fd(ini)+' al '+fd(p.fin),14,r);
r+=6;doc.text('Entradas: '+money(ei)+'   Gastos: '+money(eg)+'   Balance: '+money(ei-eg)+'   Saldo actual: '+money(calc().tot),14,r);
r+=10;const head=()=>{doc.setFont('helvetica','bold');doc.text('Fecha',14,r);doc.text('Tipo',40,r);doc.text('Concepto',62,r);doc.text('Nota',112,r);doc.text('Monto',196,r,{align:'right'});doc.setFont('helvetica','normal');r+=3;doc.line(14,r,196,r);r+=6};head();
l.forEach(x=>{if(r>280){doc.addPage();r=20;head()}const ent=x.tipo=='entrada',f=ent?fuente(x.cat):null;
doc.text(fd(new Date(x.fecha+'T12:00:00')),14,r);doc.text(ent?'Entrada':'Gasto',40,r);doc.text(cl(ent?(f?f.nombre:'Entrada'):x.cat).slice(0,28),62,r);doc.text(cl(x.nota||'').slice(0,34),112,r);doc.text((ent?'+':'-')+money(x.monto),196,r,{align:'right'});r+=7});
if(!l.length)doc.text('No hay movimientos en este periodo.',14,r);
try{doc.save('movimientos-'+hoy()+'.pdf');toast('PDF generado.')}catch(e){toast('No se pudo guardar el PDF.')}}
function lista(){const l=sorted().filter(m=>(filt=='todos'||m.tipo==filt)&&(!q||((m.nota||'')+' '+m.cat+' '+(fuente(m.cat)?fuente(m.cat).nombre:'')).toLowerCase().includes(q)));return l.map(movRow).join('')||'<p class="mut sm">No hay movimientos para mostrar.</p>'}
function editMov(id){const m=D.movs.find(x=>x.id==id);editId=id;addMov(m.tipo);$('#m_m').value=m.monto;$('#m_n').value=m.nota||'';$('#m_f').value=m.fecha;if($('#m_c'))$('#m_c').value=m.cat}
function gPrev(){const p=periodo(),y=p.ini.getFullYear(),m=p.ini.getMonth(),a=p.ini.getDate()==1,ini=a?new Date(y,m-1,16):new Date(y,m,1),fin=a?new Date(y,m,0,23,59,59):new Date(y,m,15,23,59,59);let s=0;D.movs.forEach(x=>{const f=new Date(x.fecha+'T12:00:00');if(x.tipo=='gasto'&&f>=ini&&f<=fin)s+=x.monto});return s}
function resumen(c){const pv=gPrev(),top=Object.entries(c.cat).sort((a,b)=>b[1]-a[1])[0],sob=c.qi-c.qg;let cmp='';if(pv>0&&c.qg>0){const p=Math.round((c.qg-pv)/pv*100);cmp=`<p class="sm">${p<0?'Gastas '+(-p)+'% menos':p>0?'Gastas '+p+'% más':'Gastas igual'} que la quincena pasada (${money(pv)}).</p>`}
return`<section class="card"><b>Resumen de la quincena</b><div class="row sm" style="margin-top:8px"><span>Entró</span><b class="in">${money(c.qi)}</b></div><div class="row sm"><span>Gastaste</span><b class="out">${money(c.qg)}</b></div><div class="row sm"><span>${sob>=0?'Sobra':'Te pasaste por'}</span><b>${money(Math.abs(sob))}</b></div>${top?`<p class="sm">Lo que más gastaste: ${esc(top[0])}.</p>`:''}${cmp}</section>`}
function meses(){const n=new Date(),r=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);r.push({l:d.toLocaleDateString('es-MX',{month:'short'}),y:d.getFullYear(),m:d.getMonth(),v:0})}D.movs.forEach(x=>{if(x.tipo!='gasto')return;const f=new Date(x.fecha+'T12:00:00'),k=r.find(z=>z.y==f.getFullYear()&&z.m==f.getMonth());if(k)k.v+=x.monto});const mx=Math.max(1,...r.map(z=>z.v));
return`<section class="card"><b>Gastos de los últimos meses</b><div style="display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px">${r.map(z=>`<div style="flex:1;text-align:center" class="sm"><div style="height:${Math.max(3,z.v/mx*80)}px;background:var(--btn);border-radius:6px 6px 0 0"></div><span class="mut">${z.l}</span></div>`).join('')}</div></section>`}
function metasCard(){return`<section class="card"><div class="row"><b>Metas de ahorro</b><button class="lnk" onclick="addMeta()">Nueva</button></div>`+(D.metas.map(g=>{const p=Math.min(100,g.ahorrado/g.objetivo*100);return`<div class="catrow"><div class="row sm"><span>🎯 ${esc(g.nombre)}</span><button class="lnk" onclick="abonar('${g.id}')">Abonar</button></div><div class="bar"><i style="width:${p}%;background:var(--in)"></i></div><div class="sm mut">${money(g.ahorrado)} de ${money(g.objetivo)}${p>=100?' · ¡Meta lograda!':''}</div></div>`}).join('')||'<p class="mut sm">Crea una meta, por ejemplo juntar para algo que quieres comprar.</p>')+'</section>'}
function addMeta(){sheet(`<h2>Nueva meta de ahorro</h2><label>¿Para qué?<input id="g_n"></label><label>Cuánto necesitas<input id="g_o" inputmode="decimal"></label><div class="err" id="g_e"></div><button class="btn" onclick="saveMeta()">Guardar meta</button>`)}
function saveMeta(){const n=$('#g_n').value.trim(),o=parseFloat($('#g_o').value.replace(',','.'));if(!n||!(o>0)){$('#g_e').textContent='Escribe el nombre y un monto mayor a cero.';return}D.metas.push({id:uid(),nombre:n,objetivo:o,ahorrado:0});save();closeS();app()}
function abonar(id){sheet(`<h2>Abonar a la meta</h2><label>Monto<input id="g_a" inputmode="decimal"></label><button class="btn" onclick="saveAbono('${id}')">Abonar</button>`)}
function saveAbono(id){const v=parseFloat($('#g_a').value.replace(',','.')),g=D.metas.find(x=>x.id==id);if(g&&v>0){g.ahorrado+=v;save()}closeS();app();toast('Abono guardado.')}
function limCats(){sheet('<h2>Límite por categoría</h2><p class="mut sm">Máximo por quincena. Déjalo vacío para no poner límite.</p>'+CATS.map(c=>`<label>${c.i} ${c.n}<input id="lc_${c.n}" inputmode="decimal" value="${D.limCat[c.n]||''}"></label>`).join('')+'<button class="btn" onclick="saveLC()">Guardar límites</button>')}
function saveLC(){CATS.forEach(c=>{const v=parseFloat($('#lc_'+c.n).value.replace(',','.'));if(v>0)D.limCat[c.n]=v;else delete D.limCat[c.n]});save();closeS();app();toast('Límites guardados.')}
function corte(){sheet(`<h2>Corte de caja</h2><p class="mut sm">Cuenta tus billetes y monedas y compara con la app.</p><p>Según la app: <b>${money(calc().tot)}</b></p><label>Efectivo que tienes en realidad<input id="c_m" inputmode="decimal" placeholder="0.00" oninput="corteR()"></label><div id="c_r"></div>`)}
function corteR(){const v=parseFloat($('#c_m').value.replace(',','.')),r=$('#c_r');if(isNaN(v)){r.innerHTML='';return}const d=Math.round((v-calc().tot)*100)/100;r.innerHTML=d==0?'<p class="in"><b>¡Cuadra perfecto!</b></p>':`<p style="color:var(--${d>0?'warn':'out'})"><b>${d>0?'Te sobran '+money(d):'Te faltan '+money(-d)}</b></p><button class="btn" onclick="ajuste(${d})">Ajustar saldo</button>`}
function ajuste(d){D.movs.push({id:uid(),tipo:d>0?'entrada':'gasto',monto:Math.abs(d),cat:d>0?'':'Otros',nota:'Ajuste de caja',fecha:hoy()});save();closeS();app();toast('Saldo ajustado.')}
function deudasCard(){return`<section class="card" style="margin-top:16px"><div class="row"><b>Deudas</b><button class="lnk" onclick="addDeuda()">Nueva</button></div>${D.deudas.map(x=>`<div class="mv"><div class="ic">${x.dir=='me'?'📥':'📤'}</div><div class="grow"><b>${esc(x.quien)}</b><span class="mut sm">${x.dir=='me'?'Te debe':'Le debes'}</span></div><b>${money(x.monto)}</b><button class="lnk" onclick="pagarDeuda('${x.id}')">Listo</button></div>`).join('')||'<p class="mut sm">Anota lo que te deben y lo que debes.</p>'}</section>`}
function addDeuda(){sheet(`<h2>Nueva deuda</h2><label>Tipo<select id="d_t"><option value="me">Me deben</option><option value="debo">Yo debo</option></select></label><label>¿Quién?<input id="d_q"></label><label>Monto<input id="d_m" inputmode="decimal"></label><div class="err" id="d_e"></div><button class="btn" onclick="saveDeuda()">Guardar</button>`)}
function saveDeuda(){const v=parseFloat($('#d_m').value.replace(',','.')),w=$('#d_q').value.trim();if(!w||!(v>0)){$('#d_e').textContent='Escribe quién y un monto mayor a cero.';return}D.deudas.push({id:uid(),dir:$('#d_t').value,quien:w,monto:v});save();closeS();app()}
function pagarDeuda(id){D.deudas=D.deudas.filter(x=>x.id!=id);save();app();toast('Deuda marcada como saldada.')}
function tema(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'}
function app(){const h=new Date().getHours(),s=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';
const nav=[['inicio','🏠','Inicio'],['movs','📒','Movimientos'],['fuentes','💼','Fuentes'],['ajustes','⚙️','Ajustes']];
$('#root').innerHTML=`<div class="top"><div style="display:flex;align-items:center;gap:10px">${logo(38)}<div><div class="mut sm">${s}</div><b class="nm">${esc(U.nombre)}</b></div></div><div class="av">${esc(U.nombre[0].toUpperCase())}</div></div><main>${views[tab]()}</main><button class="fab" aria-label="Nuevo movimiento" onclick="addMov('gasto')">+</button><nav><div>${nav.map(([k,i,t])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')"><span>${i}</span>${t}</button>`).join('')}</div></nav>`}

/* ---------- Formularios ---------- */
function addMov(t){const m=$('#m_m')?$('#m_m').value:'',n=$('#m_n')?$('#m_n').value:'';tipo=t||tipo;const ent=tipo=='entrada';
const sel=ent?(D.fuentes.length?`<label>¿De dónde entró?<select id="m_c">${D.fuentes.map(f=>`<option value="${f.id}">${esc(f.nombre)} (${esc(f.tipo)})</option>`).join('')}</select></label>`:`<p class="mut sm">Primero crea una fuente de ingreso, como tu trabajo o tu negocio.</p><button class="btn ghost" onclick="addFuente(true)">Crear fuente</button>`):`<label>Categoría<select id="m_c">${CATS.map(c=>`<option>${c.n}</option>`).join('')}</select></label>`;
sheet(`<h2>Nuevo movimiento</h2><div class="seg"><button class="${ent?'on':''}" onclick="addMov('entrada')">Entrada</button><button class="${ent?'':'on'}" onclick="addMov('gasto')">Gasto</button></div>
<label>Monto<input id="m_m" inputmode="decimal" placeholder="0.00" value="${esc(m)}"></label>${sel}<label>Nota (opcional)<input id="m_n" value="${esc(n)}"></label><label>Fecha<input id="m_f" type="date" value="${hoy()}"></label><div class="err" id="m_e"></div><button class="btn" onclick="saveMov()">Guardar</button>`)}
function saveMov(){const v=parseFloat($('#m_m').value.replace(',','.')),c=$('#m_c')&&$('#m_c').value,e=$('#m_e');
if(!(v>0)){e.textContent='Escribe un monto mayor a cero.';return}if(!c){e.textContent='Elige una fuente o categoría.';return}
const antes=calc().qg;if(editId){D.movs=D.movs.filter(x=>x.id!=editId);editId=null}D.movs.push({id:uid(),tipo,monto:v,cat:c,nota:$('#m_n').value.trim(),fecha:$('#m_f').value||hoy()});save();
const d=calc(),L=D.limite;closeS();app();
const CL=D.limCat[c];if(tipo=='gasto'&&CL&&d.cat[c]>CL&&d.cat[c]-v<=CL)toast('Superaste tu límite de '+c+'.');else if(tipo=='gasto'&&L){if(antes<=L&&d.qg>L)toast('Superaste tu límite de la quincena.');else if(antes<L*.8&&d.qg>=L*.8)toast('Ya gastaste el 80% de tu límite.');else toast('Gasto guardado.')}else toast(tipo=='entrada'?'Entrada guardada.':'Gasto guardado.')}
function addFuente(from){sheet(`<h2>Nueva fuente de ingreso</h2><label>Tipo<select id="f_t">${Object.keys(TIPOS).map(t=>`<option>${t}</option>`).join('')}</select></label><label>Nombre<input id="f_n" placeholder="Ej. Ramen 222"></label><label>Descripción corta<input id="f_d" placeholder="Ej. Turno de fines de semana"></label><div class="err" id="f_e"></div><button class="btn" onclick="saveFuente(${!!from})">Guardar fuente</button>`)}
function saveFuente(from){const n=$('#f_n').value.trim();if(!n){$('#f_e').textContent='Escribe un nombre para la fuente.';return}
D.fuentes.push({id:uid(),tipo:$('#f_t').value,nombre:n,desc:$('#f_d').value.trim()});save();closeS();app();if(from)addMov('entrada');else toast('Fuente guardada.')}
function setLimite(){sheet(`<h2>Límite de la quincena</h2><p class="mut sm">¿Cuánto quieres gastar como máximo en esta quincena?</p><label>Monto<input id="l_m" inputmode="decimal" value="${D.limite||''}" placeholder="0.00"></label><div class="err" id="l_e"></div><button class="btn" onclick="saveLim()">Guardar límite</button>${D.limite?'<button class="btn ghost" onclick="D.limite=0;save();closeS();app()">Quitar límite</button>':''}`)}
function saveLim(){const v=parseFloat($('#l_m').value.replace(',','.'));if(!(v>0)){$('#l_e').textContent='Escribe un monto mayor a cero.';return}D.limite=v;save();closeS();app();toast('Límite guardado.')}
function askDel(id){sheet(`<h2>¿Borrar este movimiento?</h2><p class="mut sm">Se restará de tu saldo y no se puede deshacer.</p><button class="btn" onclick="delMov('${id}')">Borrar movimiento</button><button class="btn ghost" onclick="closeS()">Cancelar</button>`)}
function delMov(id){D.movs=D.movs.filter(m=>m.id!=id);save();closeS();app();toast('Movimiento borrado.')}

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
const s=store.get('b_sess',null);if(s&&users[s])entrar(s,true);else authView('login');
</script>
</body>
